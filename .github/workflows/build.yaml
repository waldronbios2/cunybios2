name: Website and Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: Build the website and render README in rocker container
  build:
    runs-on: ubuntu-22.04
    container: rocker/verse:latest
    permissions:
      contents: write # To commit updated README
      pages: write    # To deploy to GitHub Pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add exception for git repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install required R packages
        run: |
          Rscript -e "
            pkgs <- c('pkgdown', 'kableExtra', 'dplyr', 'rmarkdown')
            installed <- rownames(installed.packages())
            needed <- pkgs[!pkgs %in% installed]
            if (length(needed) > 0) install.packages(needed, Ncpus = 2)
          "

      - name: Render README
        run: Rscript -e 'rmarkdown::render("README.Rmd", output_file = "README.md")'

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site()'

      - name: Commit updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README.md [skip ci]"
          file_pattern: README.md
          commit_user_name: Levi's GitHub Robot
          commit_user_email: lwaldron.research@gmail.com

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs

  # JOB 2: Build and push the Docker image with GitHub Actions layer caching
  push-docker:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      packages: write # To push Docker image to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
